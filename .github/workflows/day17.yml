name: LOCAL query outcome contracts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
      - name: Typed results, recovery actions and SQLite write observation
        run: |
          python -S -m examples.day17.verify --out ci-output/day17-verify
          python -S -m examples.day17.demo --out ci-output/day17-demo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: query-outcomes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-output/day17-*/**
          retention-days: 30
