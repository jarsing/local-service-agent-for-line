name: LOCAL Day 18 local20 contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
      - name: Existing offline application dependencies
        run: |
          python -m pip install -r examples/day12/requirements-core.txt
          python -m pip check
      - name: Scorer, manifest and twenty application scenarios
        run: |
          python -m examples.day18.verify_eval --validate-only
          python -m examples.day18.verify_eval --self-test --out ci-output/day18-selftest
          python -m examples.day18.verify_eval --out ci-output/day18-offline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: day18-local20-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-output/day18-*/**
          retention-days: 30
          if-no-files-found: error
