name: LOCAL Day 19 additive offline contracts
on:
  push:
    paths:
      - "examples/day19/**"
      - ".github/workflows/day19.yml"
  pull_request:
    paths:
      - "examples/day19/**"
      - ".github/workflows/day19.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.5"
      - name: Candidate standard-library tests and synthetic demo
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-output
          python -m unittest examples.day19.test_inbox_contract -v 2>&1 | tee ci-output/selftest.log
          python -m examples.day19.inbox_contract --out ci-output/day19-demo > ci-output/demo.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: day19-additive-offline-${{ github.run_id }}
          path: ci-output/
          retention-days: 14
          if-no-files-found: error
