name: LOCAL Day 23 architecture decision contracts
on:
  push:
    paths:
      - "examples/day23/**"
      - ".github/workflows/day23.yml"
  pull_request:
    paths:
      - "examples/day23/**"
      - ".github/workflows/day23.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.5"
      - name: Run offline decisions and a separately labeled local process probe
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-output
          python -m unittest examples.day23.test_stack_matrix -v 2>&1 | tee ci-output/selftest.log
          python -m examples.day23.stack_matrix --eval --out ci-output/community > ci-output/community.log
          python -m examples.day23.stack_matrix --eval --profile governed --out ci-output/governed > ci-output/governed.log
          python -m examples.day23.stack_matrix --eval --profile reporting --out ci-output/reporting > ci-output/reporting.log
          python -m examples.day23.stack_matrix --probe --runs 5 --out ci-output/local-probe > ci-output/probe.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: day23-offline-${{ github.run_id }}
          path: ci-output/
          retention-days: 14
          if-no-files-found: error
