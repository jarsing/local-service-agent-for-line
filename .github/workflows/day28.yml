name: LOCAL Day 28 Developer Contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.5"
      - name: Install day28 dependencies
        run: |
          python -m pip install -r examples/day28/requirements-dev.txt
          python -m pip check
      - name: Run 21 developer contracts and health check
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-output
          python -m unittest discover -s examples/day28 -p test_contracts.py -v 2>&1 | tee ci-output/unittest_normal.log
          python -O -m unittest discover -s examples/day28 -p test_contracts.py -v 2>&1 | tee ci-output/unittest_optimized.log
          python examples/day28/health_example.py > ci-output/health_example.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: day28-developer-contracts-${{ github.run_id }}
          path: ci-output/
          retention-days: 14
          if-no-files-found: error
